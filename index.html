<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo Secreto: ver o meu código</title>
<style>
:root{--bg:#e9efe9;--fg:#18261f;--card:#fff;--ac:#1d5a47;--acfg:#fff;--mu:#62736a;--bd:#cfdad2;--hi:#c8892b;--er:#a3282f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1814;--fg:#e8f0ea;--card:#18251f;--ac:#5fbf9f;--acfg:#0b1410;--mu:#8fa59a;--bd:#2b3d34;--hi:#e3a850;--er:#ef7b82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 Georgia,serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:28px 18px}
h1{font-size:1.9rem;line-height:1.15;margin:0 0 8px}
p{margin:0 0 12px}.mu{color:var(--mu);font-size:.92rem}
textarea{width:100%;font:inherit;color:inherit;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:8px;background:var(--ac);color:var(--acfg);font:inherit;font-weight:700;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.card{margin-top:18px;padding:18px;text-align:center;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px}
.res{font-size:2.6rem;line-height:1.1;margin:12px 0;color:var(--hi);font-weight:700}
.err{color:var(--er);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Amigo Secreto 🎁</h1>
<p class="mu">Cole aqui o código que recebeu. Nada sai do seu telemóvel.</p>
<textarea id="cd" rows="3" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"></textarea>
<button onclick="go()">Ver a quem vou oferecer</button>
<div id="out" role="status"></div>
</main>
<script>
var AL="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function stream(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)&255}}
function unb32(s){var bits=0,v=0,o=[];for(var i=0;i<s.length;i++){var x=AL.indexOf(s[i]);if(x<0)return null;v=(v<<5)|x;bits+=5;if(bits>=8){o.push((v>>>(bits-8))&255);bits-=8;v&=(1<<bits)-1}}return o}
function dec(code){
  var s=code.toUpperCase().replace(/[\s-]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1"),b=unb32(s);
  if(!b||b.length<6)return null;
  var st=stream((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3]),ck=0;
  var p=b.slice(5).map(function(x){var y=x^st();ck^=y;return y});
  if(ck!==b[4])return null;
  try{return new TextDecoder("utf-8",{fatal:true}).decode(Uint8Array.from(p))}catch(e){return null}
}
function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function go(){
  var r=dec(document.getElementById("cd").value),o=document.getElementById("out");
  o.innerHTML=r?'<div class="card"><p>Vai oferecer uma prenda a</p><div class="res">'+esc(r)+'</div><p class="mu">Segredo até ao dia da troca. 🤫</p></div>':'<p class="err">Código inválido. Confirme que o copiou completo.</p>';
}
</script>
</body>
</html>
